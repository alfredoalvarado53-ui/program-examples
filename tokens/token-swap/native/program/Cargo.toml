[package]
name = "token-swap-native-program"
version = "0.1.0"
edition = "2021"
description = "Solana Native implementation of constant-product AMM Token Swap"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-program = "2.2"
solana-system-interface = "1.0"
spl-token-interface = "0.3"
spl-associated-token-account-interface = "0.3"
thiserror = "2"

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
