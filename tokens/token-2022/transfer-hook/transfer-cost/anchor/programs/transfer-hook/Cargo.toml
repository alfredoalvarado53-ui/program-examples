[package]
name = "transfer-hook"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = "1.2.1"
# SPL crates v3.x-compatible — uses solana-program-error 3.x matching anchor-lang 1.0
spl-discriminator = "0.5.2"
spl-tlv-account-resolution = "0.11.1"
spl-transfer-hook-interface = "2.1.0"

[dev-dependencies]
litesvm = "0.18.1"
solana-account = "4.3.0"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
