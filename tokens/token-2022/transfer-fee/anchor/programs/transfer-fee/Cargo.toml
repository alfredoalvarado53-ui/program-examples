[package]
name = "transfer-fee"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_fee"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"

[dev-dependencies]
litesvm = "0.18.1"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"
